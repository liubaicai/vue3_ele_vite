name: Vue CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: pnpm/action-setup@v2
      with:
        version: 9
    - uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm run build
